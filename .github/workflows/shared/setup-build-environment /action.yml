name: Build ICU x64 (MSVC)

on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: 'Input Tag or Branch to build (e.g., release-74-2)'
        required: true
        default: 'main'
      build_config:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_tag }}
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # ICU 某些版本可能需要 Python 处理数据生成
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore NuGet Packages
        run: nuget restore icu4c/source/allinone/allinone.sln

      - name: Build ICU x64
        working-directory: icu4c/source/allinone
        run: |
          msbuild allinone.sln `
            /p:Configuration=${{ github.event.inputs.build_config }} `
            /p:Platform=x64 `
            /p:SkipUWP=true `
            /m

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icu-x64-${{ github.event.inputs.build_tag }}
          path: |
            bin64/*.dll
            bin64/*.exe
            lib64/*.lib
