# =============================================================================
# 构建 Joplin Server 的 linux/arm/v7 (armhf, 32-bit) Docker 镜像
#
# 放置位置：.github/workflows/build-server-armv7.yml
# 触发方式：Actions 页面手动 Run workflow
#
# ---------------------------------------------------------------------------
# 为什么用 arm64 runner
# ---------------------------------------------------------------------------
# 目标平台 linux/arm/v7 是 32 位 ARM，与 arm64 是不同 ABI。
# QEMU 在 aarch64 host 上模拟 armv7 远比 x86_64 host 高效：
#   - ARMv7 与 AArch64 同属一个指令集家族，条件执行/NZCV flags、桶形移位、
#     寄存器结构都能近乎 1:1 映射，TCG 指令膨胀仅 1.5-2 倍
#   - x86_64 上这些特性都要拆成多条指令模拟，膨胀 3-8 倍
# 实测体感：aarch64 host 约为 x86_64 host 的 2-4 倍速度。两种 runner 规格
# 相同（公共仓库均 4 vCPU / 16GB），对比公平。
#
# ---------------------------------------------------------------------------
# 两个 Dockerfile 怎么选
# ---------------------------------------------------------------------------
#   Dockerfile.server.armv7        QEMU 编译 sqlite3。已实机验证，稳。
#                                  全流程约 18 分钟。
#   Dockerfile.server.armv7-cross  在 arm64 上用 arm-linux-gnueabihf 交叉编译
#                                  sqlite3，绕开 QEMU。全流程预期约 8 分钟。
#                                  尚未实机验证，失败就切回上面那个。
# 两者产出等价，随时可切。
#
# ---------------------------------------------------------------------------
# 关于 QEMU
# ---------------------------------------------------------------------------
# 不需要 setup-qemu-action：BuildKit 镜像自带 QEMU 静态二进制
# （moby/buildkit 内含 buildkit-qemu-arm 等 6 个模拟器），容器 privileged
# 会自行挂载 binfmt_misc 注册。已实机验证 arm64 runner 上可直接构建 armv7。
#
# ---------------------------------------------------------------------------
# 前置条件
# ---------------------------------------------------------------------------
#   推送到 Docker Hub 需要仓库 Settings -> Secrets：
#     DOCKERHUB_USERNAME
#     DOCKERHUB_TOKEN   (Docker Hub -> Account Settings -> Personal Access Token)
#   不想推送就把 push 填 false，只做构建验证。
# =============================================================================

name: Build Joplin Server (linux/arm/v7)

on:
  workflow_dispatch:
    inputs:
      dockerfile:
        description: 'Dockerfile（armv7=稳 / armv7-cross=快）'
        required: false
        default: 'Dockerfile.server.armv7'
      runner:
        description: 'Runner 镜像'
        required: false
        default: 'ubuntu-24.04-arm'
      push:
        description: '推送到 Docker Hub (true/false)'
        required: false
        default: 'false'
      tag:
        description: '镜像 tag'
        required: false
        default: 'armv7-latest'
      node_version:
        description: 'Node 版本（只能 22，24 起无 armv7 预编译包）'
        required: false
        default: '22'

jobs:
  build:
    runs-on: ${{ inputs.runner }}

    # armv7 版约 18 分钟，cross 版约 8 分钟；x86 runner 上则要 60-120 分钟
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 自检：确认 arm/v7 真的可用。
      # buildkit 探测不到目标平台时会"静默按宿主机架构构建然后报成功"，
      # 产出的镜像在 armv7 设备上直接 exec format error —— 这是最坑的失败模式。
      - name: 确认 builder 支持 linux/arm/v7
        run: |
          echo "宿主机架构: $(uname -m)"
          echo "--- builder 支持的平台 ---"
          docker buildx inspect --bootstrap | grep -i 'platforms' || true
          echo "--- binfmt_misc ---"
          ls /proc/sys/fs/binfmt_misc/ 2>/dev/null | grep -i -E 'arm|qemu' \
            || echo "  (宿主机未注册，依赖 BuildKit 容器自带 QEMU)"

      - name: Docker Hub login (可选)
        if: ${{ inputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- 只构建不推送：验证可行性 ----------
      - name: Build (验证可行性)
        if: ${{ inputs.push != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm/v7
          push: false
          load: false
          build-args: |
            NODE_VERSION=${{ inputs.node_version }}
          tags: joplin-server:${{ inputs.tag }}
          cache-from: type=gha,scope=server-armv7
          cache-to: type=gha,mode=max,scope=server-armv7

      # ---------- 构建并推送 ----------
      - name: Build and push
        if: ${{ inputs.push == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm/v7
          push: true
          build-args: |
            NODE_VERSION=${{ inputs.node_version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/joplin-server:${{ inputs.tag }}
          cache-from: type=gha,scope=server-armv7
          cache-to: type=gha,mode=max,scope=server-armv7

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "### Joplin Server arm/v7 构建"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| Dockerfile | \`${{ inputs.dockerfile }}\` |"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| 目标平台 | \`linux/arm/v7\` |"
            echo "| Node | \`${{ inputs.node_version }}\` |"
            echo "| Tag | \`${{ inputs.tag }}\` |"
            echo "| 推送 | \`${{ inputs.push }}\` |"
          } >> $GITHUB_STEP_SUMMARY
