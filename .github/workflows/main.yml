name: Build Electron x64
on: 
  workflow_dispatch: # 手动触发测试

jobs:
  build_windows_x64:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # 或者 Joplin 要求的版本
          cache: 'yarn'

      - name: Install Dependencies
        # 使用 --frozen-lockfile 确保依赖版本锁定，避免意外错误
        run: yarn install --frozen-lockfile

      - name: Build and Distribute
        # 1. 设置环境变量跳过签名（测试不需要）
        # 2. 进入桌面版包路径
        # 3. 执行打包命令并强制指定 x64
        env:
          CSC_LINK_IGNORE: true # 忽略代码签名证书
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          ELECTRON_BUILDER_ALLOW_GITHUB_AUTO_PUBLISH: false
        run: |
          cd packages/app-desktop
          yarn dist --x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Joplin-x64-Windows
          path: packages/app-desktop/dist/*.exe
