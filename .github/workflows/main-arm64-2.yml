name: Joplin Windows ARM64 Manual Build 22

on:
  workflow_dispatch: # 手动在 GitHub Actions 页面点击运行

jobs:
  build-arm64:
    # 使用 windows-2025 以获取最新的 ARM64 交叉编译工具链
    runs-on: windows-2025

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 使用 v20 解决 v18 下 arm64 库文件 404 的问题
          cache: 'yarn'

      - name: Install Global Tools
        run: npm install -g gulp-cli

      - name: Install Dependencies
        env:
          # 告诉所有包：我们要的是 arm64
          npm_config_arch: arm64
          # 确保 sharp 知道去哪里下载预编译的 libvips 库
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
        run: |
          # 1. 正常安装。Sharp 会识别 arm64 并尝试下载它自己的 prebuilt 
          # 而 sqlite3 如果找不到 prebuilt，在这一步可能会跳过或报错，没关系
          yarn install --immutable

      - name: Build Joplin Sub-Packages
        env:
          npm_config_arch: arm64
        run: |
          cd packages/lib && gulp build
          cd ../renderer && gulp build
          cd ../tools && gulp build

      - name: Targeted Rebuild for Native Modules
        env:
          npm_config_arch: arm64
        run: |
          cd packages/app-desktop
          # 关键：我们只对 sqlite3 和 keytar 进行强制重编译
          # 这不会干扰已经通过下载安装好的 sharp
          npx @electron/rebuild --arch arm64 --only sqlite3,keytar

      - name: Package Desktop App for ARM64
        env:
          # 关键环境变量
          npm_config_arch: arm64
          SIGN_APPLICATION: 0        # 告诉 sign.js 不要签名
          CSC_LINK_IGNORE: true      # 告诉 electron-builder 忽略证书
          # 禁用自动发布到 GitHub Release
          ELECTRON_BUILDER_ALLOW_GITHUB_AUTO_PUBLISH: false 
        run: |
          cd packages/app-desktop
          # 运行桌面端专属预处理
          yarn gulp build
          yarn gulp before-dist
          # 针对 Electron 环境重构原生模块
          yarn electronRebuild --arch arm64
          # 最终打包命令：显式指定 win 和 arm64
          npx electron-builder --win --arm64

      - name: Upload ARM64 EXE
        uses: actions/upload-artifact@v4
        with:
          name: Joplin-Windows-ARM64-Package
          # 对应打包后的输出路径
          path: packages/app-desktop/dist/*.exe
          if-no-files-found: error
